[workspace]
resolver = "2"
members = ["crates/midori-core", "crates/midori-wasm"]

[workspace.package]
version = "1.0.4"
edition = "2021"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wasm-bindgen = "0.2"

# Wasm-facing builds care about download size, not compile time.
[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
